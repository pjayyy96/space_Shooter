<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Space Shooter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L27 29 L16 23 L5 29 Z' fill='%2300f0ff' stroke='%23ffe066' stroke-width='1.5'/%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #02040c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      /* Keep the 480x720 (2:3) ratio and fit the window */
      width: min(95vw, calc(95vh * 2 / 3));
      height: auto;
      background: #070b1a;
      border: 1px solid #1d2a4d;
      box-shadow: 0 0 30px #1d3a7a55;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="720"></canvas>
  <script src="game.js"></script>
</body>
</html>
